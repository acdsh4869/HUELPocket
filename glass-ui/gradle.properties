# ── 与主 App（ZZUPocket）对齐的构建配置 ─────────────────────────────
# ⚠️ 不要在这里写任何机器相关的路径（如 org.gradle.java.home、sdk.dir）。
# JDK：17 及以上均可（Gradle 8.9 支持到 JDK 22）；字节码目标固定为 17。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.3 官方只测到 compileSdk 35，本项目与主 App 一样用 36；压掉警告
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
# 允许项目路径包含非ASCII字符（中文路径）
android.overridePathCheck=true

# glass-ui 模块属性
glassui.group=com.huelpocket
glassui.version=1.0.0
glassui.composeBom=2024.12.01
glassui.activityCompose=1.9.3
glassui.haze=1.1.1
